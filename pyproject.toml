[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysynthrack"
version = "0.1.0"
description = "Modular Python software synthesizer with a drag-cable node-graph UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Matthew" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
# DearPyGui is optional so the CLI can be installed on Python versions
# that don't yet have a DPG wheel. Install with: pip install -e ".[gui]"
gui = ["dearpygui>=1.10"]
pyo = ["pyo>=1.0.5"]
# MIDI input is opt-in because python-rtmidi is a C extension that needs
# build tools (or a prebuilt wheel) and may fail to install on locked-down
# systems. The MIDIInput module logs a friendly error if mido is missing
# rather than refusing to import. Install with: pip install -e ".[midi]"
midi = ["mido>=1.3", "python-rtmidi>=1.5"]
# Media decode is opt-in: it bundles a static ffmpeg binary (~30 MB) so
# the FilePlayer can read mp3/flac/ogg and the audio track of video files
# (mp4/mkv/mov/webm) without a system ffmpeg install. Without this extra,
# the FilePlayer still reads WAV and uses a system ffmpeg if one is on
# PATH. Install with: pip install -e ".[media]"
media = ["imageio-ffmpeg>=0.4"]
# [all] intentionally excludes pyo because pyo has no wheels for newer
# Pythons and its source build needs an external C toolchain. Install
# it explicitly with `pip install -e ".[pyo]"` on supported interpreters.
all = ["dearpygui>=1.10", "mido>=1.3", "python-rtmidi>=1.5", "imageio-ffmpeg>=0.4"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mido>=1.3"]

[project.scripts]
pysynthrack = "pysynthrack.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# House style, not defects: `a = x; b = y` pairs in the DSP code, named
# lambdas as local helpers, and `l`/`I` names that mirror the maths. B905:
# `zip(strict=)` would turn a silent length mismatch into a raise -- opt in
# per call, not wholesale.
ignore = ["E501", "E702", "E731", "E741", "B905"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately raise/evaluate broad things (error_handler probes,
# attribute access that must not throw).
"tests/**" = ["B017", "B018"]
# A clean copy of the upstream ErrorHandler suite (see its header): the unused
# locals, bare re-raises and 3.11-only names are what it is testing.
"tests/test_error_handler.py" = ["B904", "E402", "F821", "F841"]
