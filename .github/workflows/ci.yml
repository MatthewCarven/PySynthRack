name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.4"
      - run: ruff check src tests tools examples packaging

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from pyproject, and the version the README recommends.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # sounddevice needs the PortAudio shared library even with no audio
      # device present (the backend tests never open a stream).
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: pip install -e ".[dev,gui]"
      - run: python -m pytest -n auto
